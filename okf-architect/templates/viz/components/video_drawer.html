  <!-- Floating Solution Video Drawer (PiP Player for YouTube, Local MP4, and Zoom) -->
  <div id="videoDrawer" class="video-drawer" style="display:none;">
    <div class="video-drawer-header" id="videoDrawerHeader">
      <div class="video-drawer-title">
        <span style="font-size:16px;">🎬</span>
        <span id="videoDrawerTitleText">Solution Video</span>
        <span class="video-drawer-time-pill" id="videoDrawerTimePill">00:00</span>
      </div>
      <div class="video-drawer-controls">
        <button class="video-drawer-ctrl-btn" onclick="toggleVideoDrawerMinimize()" title="Minimize / Expand">_</button>
        <button id="videoDrawerClose" class="video-drawer-ctrl-btn" onclick="closeVideoDrawer()" title="Close Video">✕</button>
      </div>
    </div>
    <div class="video-drawer-body" id="videoDrawerBody">
      <!-- MP4 HTML5 Video -->
      <video id="drawerMp4Player" controls playsinline style="display:none; width:100%; max-height:260px; background:#000; border-radius:6px;"></video>
      <!-- YouTube Embed Iframe -->
      <iframe id="drawerYtPlayer" style="display:none; width:100%; height:260px; border:none; border-radius:6px;" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" allowfullscreen></iframe>
      <!-- Zoom Card -->
      <div id="drawerZoomCard" style="display:none; width:100%; box-sizing:border-box; padding:16px; background:#181825; border-radius:8px; border:1px solid #313244; text-align:center;">
        <div style="font-size:28px; margin-bottom:8px;">🎥</div>
        <div style="font-weight:600; color:#cdd6f4; margin-bottom:6px;" id="zoomCardTitle">Zoom Cloud Recording</div>
        <div style="font-size:12.5px; color:#a6adc8; margin-bottom:12px;" id="zoomCardTime">Timestamp: 00:00:00</div>
        <div id="zoomCardPasscodeBox" style="margin-bottom:14px; background:#11111b; padding:6px 12px; border-radius:6px; font-family:monospace; color:#fab387; display:inline-block; border:1px dashed rgba(250, 179, 135, 0.4); font-size:12px;">
          Passcode: <span id="zoomCardPasscodeText">------</span>
        </div>
        <div>
          <button id="zoomCardLaunchBtn" class="zoom-launch-btn" onclick="launchZoomWithPasscode()">
            <span>🚀</span> Copy Passcode &amp; Open Zoom
          </button>
        </div>
      </div>
    </div>
  </div>
