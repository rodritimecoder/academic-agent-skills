<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Canvas Cornell Study Portal &bull; Active Recall Revision</title>
  <style>
    :root {
      --bg: #0b0c10;
      --card-bg: #141721;
      --card-border: #232738;
      --text: #cdd6f4;
      --text-dim: #8b92aa;
      --accent-blue: #89b4fa;
      --accent-green: #a6e3a1;
      --accent-amber: #fab387;
      --accent-violet: #cba6f7;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.5;
      padding: 30px 24px;
      max-width: 1300px;
      margin: 0 auto;
    }
    header {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      padding-bottom: 24px;
      border-bottom: 1px solid var(--card-border);
      margin-bottom: 28px;
    }
    .header-title h1 {
      font-size: 24px;
      font-weight: 700;
      color: #ffffff;
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .header-title p {
      color: var(--text-dim);
      font-size: 13px;
      margin-top: 4px;
    }
    .header-actions {
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .btn {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 8px 16px;
      border-radius: 6px;
      font-size: 13px;
      font-weight: 600;
      text-decoration: none;
      transition: all 0.2s ease;
      cursor: pointer;
    }
    .btn-cosmos {
      background: rgba(137, 180, 250, 0.15);
      color: var(--accent-blue);
      border: 1px solid rgba(137, 180, 250, 0.35);
    }
    .btn-cosmos:hover {
      background: rgba(137, 180, 250, 0.28);
      transform: translateY(-1px);
    }
    .stats-bar {
      display: flex;
      gap: 16px;
      margin-bottom: 24px;
    }
    .stat-pill {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      padding: 8px 16px;
      border-radius: 8px;
      font-size: 13px;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .stat-num {
      font-weight: 700;
      color: var(--accent-green);
    }
    .course-section {
      margin-bottom: 36px;
    }
    .course-header {
      font-size: 18px;
      font-weight: 700;
      color: #ffffff;
      margin-bottom: 14px;
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .module-group {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 10px;
      margin-bottom: 18px;
      overflow: hidden;
    }
    .module-header {
      background: rgba(255, 255, 255, 0.03);
      padding: 10px 18px;
      font-size: 14px;
      font-weight: 600;
      color: var(--accent-amber);
      border-bottom: 1px solid var(--card-border);
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .notes-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(360px, 1fr));
      gap: 14px;
      padding: 16px;
    }
    .note-card {
      background: rgba(255, 255, 255, 0.02);
      border: 1px solid rgba(255, 255, 255, 0.06);
      border-radius: 8px;
      padding: 14px 16px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      transition: all 0.2s ease;
    }
    .note-card:hover {
      border-color: var(--accent-green);
      background: rgba(166, 227, 161, 0.04);
      transform: translateY(-2px);
    }
    .note-title {
      font-size: 14px;
      font-weight: 600;
      color: #ffffff;
      margin-bottom: 6px;
    }
    .note-badges {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 12px;
    }
    .badge-cues {
      font-size: 11px;
      font-weight: 600;
      color: var(--accent-green);
      background: rgba(166, 227, 161, 0.15);
      padding: 2px 8px;
      border-radius: 4px;
    }
    .card-actions {
      display: flex;
      gap: 8px;
      margin-top: 8px;
    }
    .btn-study {
      flex: 1;
      text-align: center;
      background: #1e3a2f;
      color: var(--accent-green);
      border: 1px solid var(--accent-green);
      padding: 6px 12px;
      border-radius: 6px;
      font-size: 12px;
      font-weight: 600;
      text-decoration: none;
      transition: background 0.15s;
    }
    .btn-study:hover {
      background: #2a5242;
    }
    .filter-controls-bar {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      margin-bottom: 24px;
    }
    .course-filter-bar {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      align-items: center;
    }
    .course-filter-btn {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      color: var(--text-dim);
      padding: 6px 14px;
      border-radius: 20px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s ease;
    }
    .course-filter-btn:hover {
      border-color: var(--accent-blue);
      color: #ffffff;
    }
    .course-filter-btn.active {
      background: rgba(137, 180, 250, 0.18);
      border-color: var(--accent-blue);
      color: var(--accent-blue);
      box-shadow: 0 0 12px rgba(137, 180, 250, 0.25);
    }
    .portal-search-box {
      flex: 1;
      max-width: 360px;
      position: relative;
    }
    .portal-search-input {
      width: 100%;
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 8px;
      padding: 8px 14px 8px 34px;
      color: #ffffff;
      font-size: 13px;
      outline: none;
      transition: all 0.2s;
    }
    .portal-search-input:focus {
      border-color: var(--accent-blue);
      box-shadow: 0 0 10px rgba(137, 180, 250, 0.2);
    }
    .search-icon {
      position: absolute;
      left: 10px;
      top: 50%;
      transform: translateY(-50%);
      font-size: 13px;
      opacity: 0.6;
      pointer-events: none;
    }
  </style>
</head>
<body>
  <header>
    <div class="header-title">
      <h1><span>📝</span> Canvas Cornell Study Portal</h1>
      <p>Active Recall Revision &bull; Paired Cues &bull; Interactive Self-Quiz Mode</p>
    </div>
    <div class="header-actions">
      <a href="viz.html" class="btn btn-cosmos"><span>🌌</span> Open Knowledge Cosmos</a>
    </div>
  </header>

  <div class="stats-bar">
    <div class="stat-pill"><span>📚 Cornell Notes:</span> <span class="stat-num">{{TOTAL_CORNELL_NOTES}}</span></div>
    <div class="stat-pill"><span>⚡ Active Recall Cues:</span> <span class="stat-num">{{TOTAL_CUES}}</span></div>
    <div class="stat-pill"><span>🎓 Subjects:</span> <span class="stat-num">{{TOTAL_SUBJECTS}}</span></div>
  </div>

  <div class="filter-controls-bar">
    <div class="course-filter-bar">
      {{COURSE_FILTER_BUTTONS}}
    </div>
    <div class="portal-search-box">
      <span class="search-icon">🔍</span>
      <input type="text" id="portalSearch" class="portal-search-input" placeholder="Filter notes or cues..." oninput="handleSearch(this.value)">
    </div>
  </div>

{{COURSE_SECTIONS}}

  <script>
    let activeCourse = 'all';
    let searchQuery = '';

    function filterByCourse(course, btn) {
      activeCourse = course;
      document.querySelectorAll('.course-filter-btn').forEach(b => b.classList.remove('active'));
      if (btn) btn.classList.add('active');
      applyFilters();
    }

    function handleSearch(val) {
      searchQuery = (val || '').trim().toLowerCase();
      applyFilters();
    }

    function applyFilters() {
      const sections = document.querySelectorAll('.course-section');
      sections.forEach(sec => {
        const cName = sec.getAttribute('data-course');
        const courseMatch = (activeCourse === 'all' || cName === activeCourse);

        if (!courseMatch) {
          sec.style.display = 'none';
          return;
        }

        let sectionVisibleNotes = 0;
        const groups = sec.querySelectorAll('.module-group');
        groups.forEach(grp => {
          let groupVisibleNotes = 0;
          const cards = grp.querySelectorAll('.note-card');
          cards.forEach(card => {
            const title = card.getAttribute('data-title') || '';
            const textMatch = !searchQuery || title.includes(searchQuery);
            if (textMatch) {
              card.style.display = '';
              groupVisibleNotes++;
            } else {
              card.style.display = 'none';
            }
          });

          if (groupVisibleNotes > 0) {
            grp.style.display = '';
            sectionVisibleNotes += groupVisibleNotes;
          } else {
            grp.style.display = 'none';
          }
        });

        sec.style.display = (sectionVisibleNotes > 0) ? '' : 'none';
      });
    }
  </script>
</body>
</html>
